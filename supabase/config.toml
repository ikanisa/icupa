# Replace with the project you run locally via `supabase start`.
project_id = "icupa-local-dev"

[db]
# Pin to Postgres 15 to match managed Supabase and ensure bundled extensions (e.g. pgvector) are available.
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

# Only the dedicated Meta-signed callback is externally accessible.
# Do NOT disable JWT verification on the multiplexed auth function.
[functions.meta-wa-webhook]
verify_jwt = false
